<!DOCTYPE html>

<title>Heartbeat - 邮件摘要</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f7; }
.card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
h1 { font-size: 22px; margin: 0 0 16px; color: #1d1d1f; }
.meta { color: #86868b; font-size: 13px; margin-bottom: 20px; }
.email { border-left: 3px solid #007aff; padding-left: 14px; margin-bottom: 18px; }
.email-title { font-weight: 600; color: #1d1d1f; font-size: 15px; margin-bottom: 4px; }
.email-from { color: #86868b; font-size: 13px; margin-bottom: 6px; }
.email-preview { color: #48484a; font-size: 14px; line-height: 1.5; }
.status { display: inline-block; background: #34c759; color: white; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-top: 16px; }
</style>
</head>

<div class="email-from">来自: moshang@mochencloud.cn</div>

<div class="email">
